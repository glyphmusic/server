[package]
name = "glyph-server-native"
description = "Standalone glyph-server binary (axum + tokio) for Linux, macOS and Windows."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "glyph-server"
path = "src/main.rs"

[dependencies]
glyph-server-core.workspace = true
glyph-protocol = { workspace = true, features = ["release-verify"] }
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
async-trait.workspace = true
sha2.workspace = true
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "signal", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "stream"] }
lru = "0.12"
tempfile = "3"
clap = { version = "4", features = ["derive", "env"] }
# `glyph completions <shell>` and `glyph man`.
clap_complete = "4"
clap_mangen = "0.2"
toml = "0.8"
semver = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
self-replace = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

dialoguer = { version = "0.12", default-features = false, features = ["password"] }
dirs = "6"
getrandom = "0.3"
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tls12", "webpki-roots", "axum"] }
tokio-util = "0.7"
axum-server = "0.8"
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }
