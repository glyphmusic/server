[package]
name = "glyph-server-native"
description = "Standalone glyph-server binary (axum + tokio) for Linux, macOS and Windows."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "glyph-server"
path = "src/main.rs"

[dependencies]
glyph-server-core.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
async-trait.workspace = true
sha2.workspace = true
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
lru = "0.12"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
semver = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
self-replace = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
