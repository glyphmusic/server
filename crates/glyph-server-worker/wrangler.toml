name = "glyph-server"
main = "build/worker/shim.mjs"
compatibility_date = "2025-01-01"

# api.glyph.my: Cloudflare creates the DNS record and certificate on deploy.
# workers.dev stays reachable for older app builds.
workers_dev = true
# glyph.my: the landing page (/) and short playlist links (/p/*,
# SHARE_ORIGIN below). Needs a proxied DNS record for
# glyph.my; every other path on glyph.my is left alone.
routes = [
  { pattern = "api.glyph.my", custom_domain = true },
  { pattern = "glyph.my/", zone_name = "glyph.my" },
  { pattern = "glyph.my/p/*", zone_name = "glyph.my" },
]

# Same as the dashboard (Settings > Observability): only invocation logs.
[observability.logs]
enabled = false
invocation_logs = true

[observability.traces]
enabled = false

[build]
command = "cargo install -q worker-build && worker-build --release"

# Workers KV: long-lived cache (resolver mappings, lyrics). Create it with
#   npx wrangler kv namespace create GLYPH_KV
# and paste the printed id below.
[[kv_namespaces]]
binding = "GLYPH_KV"
id = "2ad9460e110d401a8375359fa1393134"

# Accounts & sync (see docs/ACCOUNTS.md in the app repo). Schema changes:
#   npx wrangler d1 migrations apply glyph --remote
[[d1_databases]]
binding = "GLYPH_DB"
database_name = "glyph"
database_id = "a25fcd70-4ff2-4a66-9e89-7b7f72cf9099"
migrations_dir = "migrations"

# Cover cache (R2).
[[r2_buckets]]
binding = "GLYPH_COVERS"
bucket_name = "glyph-covers"

[vars]
RATE_LIMIT_PER_MIN = "60"
# Passkeys are bound to ACCOUNT_RP_ID (the origin's host or a parent of it);
# changing it later invalidates every passkey.
PUBLIC_ORIGIN = "https://api.glyph.my"
ACCOUNT_RP_ID = "glyph.my"
SHARE_ORIGIN = "https://glyph.my"
YOUTUBE_DAILY_BUDGET_UNITS = "9000"

# Secrets (never put keys in this file). Set each one you have with
#   npx wrangler secret put <NAME>
# Missing secrets simply disable that provider.
#   YOUTUBE_API_KEY
#   JAMENDO_CLIENT_ID
#   SOUNDCLOUD_CLIENT_ID
#   SOUNDCLOUD_CLIENT_SECRET
#   SPOTIFY_CLIENT_ID
#   SPOTIFY_CLIENT_SECRET
#   LASTFM_API_KEY
# Optional native yt-dlp companion (Worker stays the app's only server):
#   YTDLP_SERVICE_URL   HTTPS base URL, no trailing /internal path
#   YTDLP_SERVICE_TOKEN Shared random secret, at least 32 characters
# For `wrangler dev`, put the same names in crates/glyph-server-worker/.dev.vars
