name = "glyph-server"
# Optional: set REQUIRE_ACCOUNT="true" in vars (or use remote limits
# --require-account true). Requires GLYPH_DB and PUBLIC_ORIGIN for accounts.
main = "build/worker/shim.mjs"
compatibility_date = "2025-01-01"

# api.glyph.my: Cloudflare creates the DNS record and certificate on deploy.
# workers.dev stays reachable for older app builds.
workers_dev = true
# glyph.my: the landing page (/) and short playlist links (/p/*,
# SHARE_ORIGIN below). Needs a proxied DNS record for
# glyph.my; the site pages and embedded assets must all reach this Worker.
routes = [
  { pattern = "api.glyph.my", custom_domain = true },
  { pattern = "glyph.my/", zone_name = "glyph.my" },
  { pattern = "glyph.my/p/*", zone_name = "glyph.my" },
  { pattern = "glyph.my/download*", zone_name = "glyph.my" },
  { pattern = "glyph.my/shots/*", zone_name = "glyph.my" },
  { pattern = "glyph.my/favicon.ico", zone_name = "glyph.my" },
  { pattern = "glyph.my/icon.png", zone_name = "glyph.my" },
  { pattern = "glyph.my/apple-touch-icon.png", zone_name = "glyph.my" },
  { pattern = "glyph.my/site.webmanifest", zone_name = "glyph.my" },
  { pattern = "glyph.my/og.png", zone_name = "glyph.my" },
  { pattern = "glyph.my/robots.txt", zone_name = "glyph.my" },
  { pattern = "glyph.my/sitemap.xml", zone_name = "glyph.my" },
  { pattern = "glyph.my/llms.txt", zone_name = "glyph.my" },
  { pattern = "glyph.my/.well-known/security.txt", zone_name = "glyph.my" },
]

# Keep production diagnostics in sync with the Cloudflare dashboard.
[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1.0

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[observability.issues]
enabled = true

# Auth must run before every request. The targeted in-Worker media cache remains on.
[cache]
enabled = false

[build]
command = "cargo install -q worker-build && worker-build --release"

# Workers KV: long-lived cache (resolver mappings, lyrics). Create it with
#   npx wrangler kv namespace create GLYPH_KV
# and paste the printed id below.
[[kv_namespaces]]
binding = "GLYPH_KV"
id = "2ad9460e110d401a8375359fa1393134"

# Accounts & sync (see docs/ACCOUNTS.md in the app repo). Schema changes:
#   npx wrangler d1 migrations apply glyph --remote
[[d1_databases]]
binding = "GLYPH_DB"
database_name = "glyph"
database_id = "a25fcd70-4ff2-4a66-9e89-7b7f72cf9099"
migrations_dir = "migrations"

# Cover cache (R2).
[[r2_buckets]]
binding = "GLYPH_COVERS"
bucket_name = "glyph-covers"

# The same bucket also keeps audio fetched through the yt-dlp companion
# (prefix `audio/`), so each song leaves the companion machine once. Optional:
#   npx wrangler r2 bucket lifecycle add glyph-covers expire-audio audio/ --expire-days 15

[vars]
RATE_LIMIT_PER_MIN = "60"
# Passkeys are bound to ACCOUNT_RP_ID (the origin's host or a parent of it);
# changing it later invalidates every passkey.
PUBLIC_ORIGIN = "https://api.glyph.my"
ACCOUNT_RP_ID = "glyph.my"
SHARE_ORIGIN = "https://glyph.my"
YOUTUBE_DAILY_BUDGET_UNITS = "9000"

# Secrets (never put keys in this file). Set each one you have with
#   npx wrangler secret put <NAME>
# Missing secrets simply disable that provider.
#   YOUTUBE_API_KEY
#   JAMENDO_CLIENT_ID
#   SOUNDCLOUD_CLIENT_ID
#   SOUNDCLOUD_CLIENT_SECRET
#   SPOTIFY_CLIENT_ID
#   SPOTIFY_CLIENT_SECRET
#   LASTFM_API_KEY
# Optional native yt-dlp companion (Worker stays the app's only server):
#   YTDLP_SERVICE_URL   HTTPS base URL, no trailing /internal path
#   YTDLP_SERVICE_TOKEN Shared random secret, at least 32 characters
# For `wrangler dev`, put the same names in crates/glyph-server-worker/.dev.vars

# Optional private-instance access (off by default): wrangler secret put GLYPH_SERVER_BEARER

# Hourly full R2 recount; minute ticks finish bounded inventory/eviction batches.
[triggers]
crons = ["* * * * *"]
