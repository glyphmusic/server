[package]
name = "glyph-server-worker"
description = "Cloudflare Workers entry point of glyph-server."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The Worker SDK only makes sense on wasm32; on native targets this crate is
# an empty shell so `cargo test --workspace` keeps working everywhere.
[target.'cfg(target_arch = "wasm32")'.dependencies]
glyph-server-core.workspace = true
glyph-protocol.workspace = true
serde_json.workspace = true
worker = { version = "0.8", features = ["d1"] }
async-trait.workspace = true
futures.workspace = true
console_error_panic_hook = "0.1"
serde.workspace = true
# Entropy for account tokens: crypto.getRandomValues via the JS backend.
getrandom = { version = "0.2", features = ["js"] }
# #[durable_object] (src/jam_room.rs) expands to wasm-bindgen code.
wasm-bindgen = "0.2"
