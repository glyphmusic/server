[package]
name = "glyph-server-core"
description = "Platform-neutral logic of glyph-server (routing, providers, resolver, caching, rate limiting)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
glyph-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
async-trait.workspace = true
url.workspace = true
base64.workspace = true
sha2.workspace = true
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
hmac = "0.12"
# Passkeys: ES256 and RS256 signature checks (pure Rust, builds for wasm32).
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
rsa = { version = "0.9", default-features = false, features = ["sha2", "std"] }

[dev-dependencies]
rand = "0.8"
