<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{TITLE}} — Glyph docs</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{CANON}}">
<link rel="alternate" type="text/markdown" href="{{MD}}">
<link rel="help" type="text/markdown" href="{{BASE}}/llms.txt" title="llms.txt">
<meta property="og:title" content="{{TITLE}} — Glyph docs">
<meta property="og:description" content="{{DESC}}">
<meta property="og:image" content="https://glyph.my/og.png">
<meta name="theme-color" content="#030303">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/*PANEL*/
/* Docs: the Settings window with SUMMARY.md as the nav (groups, pages,
   pages under a page as sub-tabs) and the Markdown as the page. */
.nav .list { padding-bottom: 16px; }
.sub.deep { margin-left: 12px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 40px; align-items: start; }
.doc { max-width: 720px; min-width: 0; }
.doc h1 { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 17px; line-height: 1.35; font-weight: 600; color: #fff; }
.doc h1 .crumb, .doc h1 .sep { color: rgba(255, 255, 255, .5); }
.doc .lead { margin: 4px 0 18px; font-size: 13.5px; line-height: 1.5; color: rgba(255, 255, 255, .55); }
.doc h2 { margin: 30px 0 8px; padding-top: 22px; border-top: 1px solid rgba(255, 255, 255, .06); font-size: 15px; line-height: 1.4; font-weight: 600; color: #fff; }
.doc h3 { margin: 22px 0 6px; font-size: 14px; font-weight: 600; color: #fff; }
.doc h4 { margin: 18px 0 4px; font-size: 11.5px; font-weight: 600; color: rgba(255, 255, 255, .45); text-transform: uppercase; }
.doc h2, .doc h3, .doc h4 { scroll-margin-top: 16px; }
.doc .anchor { color: inherit; text-decoration: none; }
.doc .anchor:hover::after { content: " #"; color: rgba(255, 255, 255, .3); font-weight: 400; }
.doc pre { position: relative; margin: 12px 0 14px; padding: 12px 14px; border-radius: 8px; background: #161618; overflow-x: auto; font: 12.5px/20px var(--mono); font-variant-ligatures: none; color: rgba(255, 255, 255, .88); }
.doc pre code { padding: 0; background: none; font-size: inherit; }
.doc pre .tbtn { position: absolute; top: 6px; right: 6px; background: #222226; opacity: 0; font-family: var(--font); }
.doc pre:hover .tbtn, .doc pre .tbtn:focus-visible { opacity: 1; }
.doc table { display: block; overflow-x: auto; width: 100%; margin: 6px 0 14px; border-collapse: collapse; font-size: 13.5px; line-height: 20px; }
.doc th { padding: 14px 20px 4px 0; text-align: left; font-size: 11.5px; font-weight: 600; color: rgba(255, 255, 255, .45); text-transform: uppercase; white-space: nowrap; }
.doc td { padding: 12px 20px 12px 0; vertical-align: top; border-top: 1px solid rgba(255, 255, 255, .06); }
.doc blockquote { margin: 12px 0; padding: 0 0 0 14px; border-left: 2px solid rgba(255, 255, 255, .10); color: rgba(255, 255, 255, .6); }
.doc img { max-width: 100%; height: auto; border-radius: 8px; }
.doc hr { border: 0; border-top: 1px solid rgba(255, 255, 255, .06); margin: 24px 0; }
/* RiskNote card: px 16 py 14, radius 10, white 3.5 %, 13 / 19 white 72 %; warning in warn */
.hint { margin: 14px 0; padding: 12px 16px 14px; border-radius: 10px; background: rgba(255, 255, 255, .035); font-size: 13.5px; line-height: 21px; color: rgba(255, 255, 255, .72); }
.hint::before { content: "Note"; display: block; margin-bottom: 2px; font-size: 11.5px; font-weight: 600; color: rgba(255, 255, 255, .45); text-transform: uppercase; }
.hint.warning::before { content: "Warning"; color: var(--warn); }
.hint.danger::before { content: "Careful"; color: var(--warn); }
.hint.success::before { content: "Tip"; }
.hint > :first-child, .tab > :nth-child(2) { margin-top: 0; }
.hint > :last-child, .tab > :last-child { margin-bottom: 0; }
.tabs { margin: 14px 0; padding: 8px; border-radius: 10px; background: rgba(255, 255, 255, .035); }
.tabs .seg { margin-bottom: 4px; }
.tab { padding: 8px 6px 4px; }
.tab-title { font-size: 11.5px; font-weight: 600; color: rgba(255, 255, 255, .45); text-transform: uppercase; }
.tabs.live .tab-title { display: none; }
.doc details { padding: 12px 0; border-top: 1px solid rgba(255, 255, 255, .06); }
.doc details summary { cursor: pointer; font-size: 14px; font-weight: 500; color: #fff; }
.doc details summary::marker { color: rgba(255, 255, 255, .45); }
.doc details[open] summary { margin-bottom: 8px; }
.onpage { margin: 0 0 18px; padding: 4px 6px 6px; border-radius: 10px; background: rgba(255, 255, 255, .035); }
.onpage ul, .otp ul { list-style: none; margin: 0; padding: 0; }
.onpage li, .otp li { margin: 0; padding: 0; }
.onpage::before { content: "On this page"; display: block; padding: 8px 10px 4px; font-size: 12px; color: rgba(255, 255, 255, .45); }
.onpage a { display: block; padding: 6px 10px; border-radius: 7px; font-size: 13.5px; color: rgba(255, 255, 255, .6); text-decoration: none; }
.onpage a:hover { background: rgba(255, 255, 255, .04); color: #fff; }
/* Right column: the sections as sub-tabs on a thin line, the one on screen open */
.otp { position: sticky; top: 0; max-height: calc(100vh - 110px); overflow-y: auto; scrollbar-width: none; }
.otp .gl { padding-left: 0; }
.otp ul { margin-top: 2px; padding-left: 8px; border-left: 1px solid rgba(255, 255, 255, .10); display: flex; flex-direction: column; gap: 2px; }
.otp a { display: block; padding: 6px 10px; border-radius: 7px; font-size: 13px; line-height: 1.35; color: rgba(255, 255, 255, .6); transition: background-color .15s ease-out, color .15s ease-out; }
.otp a:hover { background: rgba(255, 255, 255, .04); color: #fff; }
.otp a.sel { background: rgba(255, 255, 255, .08); color: #fff; font-weight: 500; }
.otp:empty { display: none; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 32px; }
.pager a { display: flex; flex-direction: column; gap: 3px; padding: 12px 14px; border-radius: 10px; background: rgba(255, 255, 255, .035); font-size: 14px; font-weight: 500; color: #fff; text-decoration: none; transition: background-color .12s; }
.pager a:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.pager a span { font-size: 12.5px; font-weight: 400; color: rgba(255, 255, 255, .55); }
.pager .next { grid-column: 2; text-align: right; }
.edit { margin: 14px 0 0; font-size: 12.5px; color: rgba(255, 255, 255, .45); }
.edit a { color: rgba(255, 255, 255, .55); text-decoration-color: rgba(255, 255, 255, .2); }
@media (max-width: 1239px) {
  .cols { display: block; }
  .otp { display: none; }
}
@media (min-width: 1240px) { .doc .onpage { display: none; } }
@media (max-width: 860px) {
  .search kbd { display: none; }
  .pager { grid-template-columns: 1fr; }
  .pager .next { grid-column: 1; }
}
</style>
</head>
<body>
<canvas class="bgfx" id="glow" aria-hidden="true"></canvas><canvas class="bgfx" id="ascii" aria-hidden="true"></canvas>
<!--TITLEBAR-->
<div class="win">
<aside class="nav" id="menu" aria-label="Docs">
  <div class="mhead"><!--MBACK--><h2>Docs</h2><span class="sp"></span></div>
  <label class="search"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="M20.5 20.5l-4.2-4.2"/></svg><input type="search" placeholder="Search docs" aria-label="Search docs" autocomplete="off" spellcheck="false"><kbd>/</kbd></label>
  <div class="list">{{NAV}}<div class="found"></div></div>
  <!--MSITE-->
</aside>
<main class="content">
<div class="cols">
<article class="prose doc">
{{BODY}}
</article>
<aside class="otp" aria-label="On this page">{{ONPAGE}}</aside>
</div>
<footer class="foot">
  <span>Glyph · MIT / Apache-2.0 · <a href="{{BASE}}/llms.txt">llms.txt</a></span>
  <span><a href="https://github.com/glyphmusic/docs">Docs on GitHub</a> · <a href="https://github.com/glyphmusic/apps">App</a> · <a href="https://github.com/glyphmusic/server">Server</a></span>
</footer>
</main>
</div>
<script>/*GLOW*/
/*MENU*/
(() => {
  const glow = glyphGlow(document.getElementById("glow"), document.getElementById("ascii"), 44);
  glow.palette(0x6a2a5e, 0xd291c4, 0xf3d6ec);

  const nav = document.querySelector(".nav");
  const list = nav.querySelector(".list");
  // Keep the current page visible in a long list.
  const cur = list.querySelector("[aria-current]");
  if (cur && list.scrollHeight > list.clientHeight) list.scrollTop = cur.offsetTop - list.offsetTop - list.clientHeight / 3;

  // GitBook tabs as the app's segmented control.
  document.querySelectorAll(".tabs").forEach(box => {
    const tabs = [...box.children].filter(c => c.classList.contains("tab"));
    if (!tabs.length) return;
    const bar = document.createElement("div");
    bar.className = "seg";
    bar.setAttribute("role", "tablist");
    const show = i => tabs.forEach((t, j) => {
      t.hidden = i !== j;
      bar.children[j].setAttribute("aria-selected", String(i === j));
    });
    tabs.forEach((t, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "o";
      b.setAttribute("role", "tab");
      b.textContent = t.querySelector(".tab-title")?.textContent || "Tab " + (i + 1);
      b.addEventListener("click", () => show(i));
      bar.append(b);
    });
    box.prepend(bar);
    box.classList.add("live");
    show(0);
  });

  // A copy button on every code block.
  document.querySelectorAll(".doc pre").forEach(pre => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tbtn";
    b.textContent = "Copy";
    b.addEventListener("click", () => {
      navigator.clipboard?.writeText((pre.querySelector("code") || pre).innerText.replace(/\n$/, "")).then(() => {
        b.textContent = "Copied";
        setTimeout(() => { b.textContent = "Copy"; }, 1500);
      });
    });
    pre.append(b);
  });

  // "On this page": the section on screen is the open one.
  const spy = new Map([...document.querySelectorAll(".otp a")].map(a => [decodeURIComponent(a.hash.slice(1)), a]));
  const heads = [...spy.keys()].map(id => document.getElementById(id)).filter(Boolean);
  if (heads.length) {
    const markSpy = () => {
      let at = heads[0];
      for (const h of heads) if (h.getBoundingClientRect().top < innerHeight * 0.3) at = h;
      if (glyphAtEnd()) at = heads[heads.length - 1];
      for (const [id, a] of spy) a.classList.toggle("sel", id === at.id);
    };
    document.addEventListener("scroll", e => { if (!e.target.closest?.(".nav, .otp")) markSpy(); }, { passive: true, capture: true });
    markSpy();
  }

  // Search, as in the Settings nav: pages whose name matches stay in the
  // list, and matches inside pages show below it ("In the docs").
  const input = nav.querySelector(".search input");
  const found = list.querySelector(".found");
  const items = [...list.children].filter(el => el !== found);
  const subsShut = new Map([...list.querySelectorAll(".subs")].map(s => [s, s.hidden]));
  let index = null, loading = null, sel = -1;
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const load = () => loading ||= fetch("{{BASE}}/search.json").then(r => r.json()).then(j => { index = j.pages; run(); }).catch(() => { found.innerHTML = '<div class="none-found">Search is unavailable right now.</div>'; });
  const mark = (text, words) => {
    let html = esc(text);
    for (const w of words) html = html.replace(new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`);
    return html;
  };
  const snippet = (text, words) => {
    const low = text.toLowerCase(), whole = low.indexOf(words.join(" "));
    const at = whole >= 0 ? whole : Math.max(0, Math.min(...words.map(w => { const i = low.indexOf(w); return i < 0 ? Infinity : i; })));
    if (!isFinite(at)) return text.slice(0, 120);
    const start = Math.max(0, at - 30);
    return (start ? "…" : "") + text.slice(start, start + 120);
  };
  function filterNav(words) {
    const hit = el => words.every(w => el.textContent.toLowerCase().includes(w));
    let group = null, groupShown = false, shown = 0;
    const close = () => { if (group) group.hidden = !groupShown; };
    for (const el of items) {
      if (el.classList.contains("gl")) { close(); group = el; groupShown = false; continue; }
      if (el.classList.contains("subs")) {
        if (!words.length) { el.hidden = subsShut.get(el); for (const s of el.children) s.hidden = false; continue; }
        let any = false;
        for (const s of el.children) { s.hidden = !hit(s); any ||= !s.hidden; }
        el.hidden = !any;
        if (any) { el.previousElementSibling.hidden = false; groupShown = true; shown++; }
        continue;
      }
      el.hidden = words.length > 0 && !hit(el);
      if (!el.hidden) { groupShown = true; shown++; }
    }
    close();
    return shown;
  }
  function run() {
    const words = input.value.toLowerCase().split(/\s+/).filter(Boolean);
    const shown = filterNav(words);
    sel = -1;
    if (!words.length) { found.innerHTML = ""; return; }
    if (!index) { load(); return; }
    let hits = [];
    for (const p of index) {
      let score = 0, heading = null;
      const title = p.t.toLowerCase(), desc = p.d.toLowerCase(), text = p.x.toLowerCase();
      const ok = words.every(w => {
        let s = 0;
        if (title.includes(w)) s += title.startsWith(w) ? 14 : 10;
        const h = p.h.find(([, t]) => t.toLowerCase().includes(w));
        if (h) { s += 6; heading ||= h; }
        if (desc.includes(w)) s += 3;
        if (text.includes(w)) s += 1 + Math.min(4, text.split(w).length - 2);
        score += s;
        return s > 0;
      });
      // The whole query as written counts most.
      const phrase = words.join(" ");
      if (ok && words.length > 1) {
        const exact = p.h.find(([, t]) => t.toLowerCase().includes(phrase));
        if (exact) { score += 30; heading = exact; }
        if (title.includes(phrase)) score += 30;
        if (text.includes(phrase)) score += 8;
      }
      if (ok) hits.push({ p, score, heading });
    }
    hits.sort((a, b) => b.score - a.score);
    hits = hits.slice(0, 12);
    found.innerHTML = hits.length
      ? '<div class="gl">In the docs</div>' + hits.map(({ p, heading }) => {
          const url = heading && !p.t.toLowerCase().includes(words[0]) ? `${p.u}#${heading[0]}` : p.u;
          const where = heading ? `${mark(p.t, words)} › ${mark(heading[1], words)}` : mark(p.t, words);
          return `<a class="opt" href="${esc(url)}"><span class="ol">${where}</span><span class="oc">${mark(snippet(p.x, words), words)}</span></a>`;
        }).join("")
      : shown ? "" : '<div class="none-found">Nothing found.</div>';
  }
  const pick = i => {
    const opts = [...found.querySelectorAll(".opt")];
    if (!opts.length) return;
    sel = (i + opts.length) % opts.length;
    opts.forEach((a, j) => a.classList.toggle("sel", j === sel));
    opts[sel].scrollIntoView({ block: "nearest" });
  };
  input.addEventListener("focus", load);
  input.addEventListener("input", run);
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); pick(sel + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); pick(sel - 1); }
    else if (e.key === "Enter") {
      const a = found.querySelectorAll(".opt")[Math.max(sel, 0)] || [...list.querySelectorAll(".pg, .sub")].find(x => !x.hidden && x.offsetParent);
      if (a) { e.preventDefault(); location.href = a.href; }
    } else if (e.key === "Escape") { input.value = ""; run(); input.blur(); }
  });
  document.addEventListener("keydown", e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "");
    if ((e.key === "k" && (e.ctrlKey || e.metaKey)) || (e.key === "/" && !typing)) { e.preventDefault(); input.focus(); input.select(); }
  });
})();
</script>
</body>
</html>
