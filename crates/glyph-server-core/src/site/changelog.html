<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>What's new — Glyph</title>
<meta name="description" content="Every release of Glyph: the desktop app, the server, the companion and r-dlp, newest first.">
<link rel="canonical" href="https://glyph.my/changelog">
<meta name="theme-color" content="#030303">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/*PANEL*/
/* Changelog: Settings window with the versions as nav pages (month = group
   label), the newest release of each part as rows, the parts as a segmented
   control, every release as a section of the page. */
.list .mon { display: flex; flex-direction: column; gap: 2px; }
.list .pg { height: 32px; font-size: 13px; }
.list .pg .kc { margin-left: auto; }
.list .pg[data-repo="desktop"] .kc { color: rgba(255, 255, 255, .8); }
.tools { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 18px -28px 0; padding: 12px 28px; background: #0c0c0c; border-bottom: 1px solid rgba(255, 255, 255, .06); }
.tools .cnt { font-size: 12.5px; color: rgba(255, 255, 255, .45); margin-left: auto; }
.ver { font-size: 13px; color: rgba(255, 255, 255, .9); }
.rows .srow .c .ic { width: 14px; height: 14px; }
.rel { padding: 22px 0 10px; scroll-margin-top: 70px; }
.rel + .rel { border-top: 1px solid rgba(255, 255, 255, .06); }
.rh { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.rv { font-size: 16px; font-weight: 700; color: #fff; }
.rv:hover { color: var(--pink); }
.rh .gh { margin-left: auto; }
.rel .prose { max-width: 720px; }
.rel .sum { margin: 10px 0 0; }
.rel .sl { margin: 0; padding: 16px 0 6px; }
.rel .sl .n { font-weight: 400; color: rgba(255, 255, 255, .3); }
.rel ul { margin: 0; }
.rel li { margin: 6px 0; }
.empty { padding: 36px 0; text-align: center; font-size: 12.5px; color: rgba(255, 255, 255, .55); }
.empty button { color: #fff; text-decoration: underline; text-underline-offset: 2px; }
.list .gl.found { display: none; }
/* Inside the window the bar sticks to its top edge, over the page's padding. */
@media (min-width: 861px) { .tools { top: -22px; } }
@media (max-width: 860px) {
  .tools { margin: 18px -16px 0; padding: 10px 16px; }
  .tools .cnt { display: none; }
  .seg { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
}
</style>
</head>
<body>
<canvas class="bgfx" id="glow" aria-hidden="true"></canvas><canvas class="bgfx" id="ascii" aria-hidden="true"></canvas>
<!--TITLEBAR-->

<div class="win">
<aside class="nav" id="menu" aria-label="Versions">
  <div class="mhead"><!--MBACK--><h2>Versions</h2><span class="sp"></span></div>
  <label class="search"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="M20.5 20.5l-4.2-4.2"/></svg><input type="search" placeholder="Search releases" aria-label="Search releases" autocomplete="off" spellcheck="false"><kbd>/</kbd></label>
  <div class="list"><!--VERSIONS--></div>
  <!--MSITE-->
</aside>
<main class="content" data-fade-top="0">
  <h1 class="title">What's new</h1>
  <p class="subt">Every release of every part of Glyph, newest first. <!--COUNT--></p>
  <div class="sl">Newest</div>
  <div class="rows"><!--LATEST--></div>
  <div class="tools">
    <div class="seg" role="group" aria-label="Show releases of">
      <button type="button" class="o" data-repo="" aria-pressed="true">All</button>
      <button type="button" class="o" data-repo="desktop" aria-pressed="false">App</button>
      <button type="button" class="o" data-repo="server" aria-pressed="false">Server &amp; CLI</button>
      <button type="button" class="o" data-repo="companion" aria-pressed="false">Companion</button>
      <button type="button" class="o" data-repo="r-dlp" aria-pressed="false">r-dlp</button>
    </div>
    <span class="cnt" aria-live="polite"></span>
  </div>
  <div id="releases">
<!--RELEASES-->
  <p class="empty" hidden>No release matches. <button type="button">Show all</button></p>
  </div>
<footer class="foot">
  <span>Glyph · MIT / Apache-2.0</span>
  <span><a href="https://github.com/glyphmusic/apps">App</a> · <a href="https://github.com/glyphmusic/server">Server</a> · <a href="https://github.com/glyphmusic/companion">Companion</a> · <a href="https://github.com/glyphmusic/r-dlp">r-dlp</a> · <a href="https://x.com/glyph_my" rel="me noopener">X</a></span>
</footer>
</main>
</div>
<script>/*GLOW*/
/*MENU*/
(() => {
  const glow = glyphGlow(document.getElementById("glow"), document.getElementById("ascii"), 44);
  glow.palette(0x6a2a5e, 0xd291c4, 0xf3d6ec);

  const rels = [...document.querySelectorAll(".rel")];
  const links = new Map([...document.querySelectorAll(".list .pg")].map(a => [a.hash.slice(1), a]));
  const months = [...document.querySelectorAll(".list .mon")];
  const buttons = [...document.querySelectorAll(".seg .o")];
  const input = document.querySelector(".search input");
  const cnt = document.querySelector(".cnt");
  const empty = document.querySelector(".empty");
  const text = new Map(rels.map(r => [r, r.textContent.toLowerCase()]));
  let repo = "", query = "";

  // Release counts in the segmented control (mono, like the app's counts).
  for (const b of buttons) {
    const n = b.dataset.repo ? rels.filter(r => r.dataset.repo === b.dataset.repo).length : rels.length;
    b.insertAdjacentHTML("beforeend", `<span class="n">${n}</span>`);
  }

  // Filter by part and by words; ?repo=server&q=lyrics keeps the choice in the URL.
  const apply = () => {
    const words = query.toLowerCase().split(/\s+/).filter(Boolean);
    let count = 0;
    for (const r of rels) {
      const hide = (Boolean(repo) && r.dataset.repo !== repo) || !words.every(w => text.get(r).includes(w));
      r.hidden = hide;
      const a = links.get(r.id);
      if (a) a.hidden = hide;
      if (!hide) count++;
    }
    for (const m of months) m.hidden = ![...m.querySelectorAll(".pg")].some(a => !a.hidden);
    for (const b of buttons) b.setAttribute("aria-pressed", String(b.dataset.repo === repo));
    cnt.textContent = count === rels.length ? "" : `${count} of ${rels.length}`;
    empty.hidden = count > 0;
    const url = new URL(location.href);
    repo ? url.searchParams.set("repo", repo) : url.searchParams.delete("repo");
    query ? url.searchParams.set("q", query) : url.searchParams.delete("q");
    history.replaceState(null, "", url);
    mark();
  };
  for (const b of buttons) b.addEventListener("click", () => { repo = b.dataset.repo; apply(); });
  input.addEventListener("input", () => { query = input.value.trim(); apply(); });
  input.addEventListener("keydown", e => { if (e.key === "Escape") { input.value = ""; query = ""; apply(); input.blur(); } });
  empty.querySelector("button").addEventListener("click", () => { repo = ""; query = ""; input.value = ""; apply(); });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== input && !e.ctrlKey && !e.metaKey) { e.preventDefault(); input.focus(); }
  });
  // A row or link to a hidden release clears the filters first.
  document.addEventListener("click", e => {
    const a = e.target.closest("a[href^='#']");
    const target = a && document.getElementById(decodeURIComponent(a.hash.slice(1)));
    if (target && target.hidden) { repo = ""; query = ""; input.value = ""; apply(); }
  });

  // The release at the top of the screen is the open page in the nav.
  const list = document.querySelector(".list");
  function mark() {
    const top = rels.find(r => !r.hidden && r.getBoundingClientRect().bottom > 90);
    for (const [id, a] of links) a.classList.toggle("on", Boolean(top) && id === top.id);
    const cur = top && links.get(top.id);
    if (cur && list.scrollHeight > list.clientHeight) {
      const box = list.getBoundingClientRect(), at = cur.getBoundingClientRect();
      if (at.top < box.top + 40 || at.bottom > box.bottom - 40) list.scrollTop += at.top - box.top - box.height / 3;
    }
  }
  let ticking = false;
  document.addEventListener("scroll", e => { if (e.target.closest?.(".nav")) return; if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; mark(); }); } }, { passive: true, capture: true });

  const params = new URLSearchParams(location.search);
  const wanted = params.get("repo");
  if (wanted && buttons.some(b => b.dataset.repo === wanted)) repo = wanted;
  query = params.get("q") || "";
  input.value = query;
  if (repo || query) apply(); else mark();
})();
</script>
</body>
</html>
