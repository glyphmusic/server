name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: glyph-server
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: glyph-server
        run: cargo build --release -p glyph-server-native --target ${{ matrix.target }}
      - name: Package
        working-directory: glyph-server
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="glyph-server-${VERSION}-${{ matrix.target }}"
          mkdir -p dist/stage
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/glyph-server.exe" dist/stage/glyph.exe
            cp LICENSE-MIT LICENSE-APACHE README.md dist/stage/
            (cd dist/stage && 7z a -tzip "../${NAME}.zip" . >/dev/null)
            ARCHIVE="dist/${NAME}.zip"
          else
            cp "target/${{ matrix.target }}/release/glyph-server" dist/stage/glyph
            cp LICENSE-MIT LICENSE-APACHE README.md dist/stage/
            tar -C dist/stage -czf "dist/${NAME}.tar.gz" .
            ARCHIVE="dist/${NAME}.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "$(basename "$ARCHIVE")" > "$(basename "$ARCHIVE").sha256")
          else
            (cd dist && shasum -a 256 "$(basename "$ARCHIVE")" > "$(basename "$ARCHIVE").sha256")
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: glyph-server/RELEASE_NOTES.md
          files: |
            glyph-server/${{ env.ARCHIVE }}
      - uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.target }}
          path: glyph-server/dist/*.sha256
          if-no-files-found: error

  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: glyph-server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build the portable Worker payload
        working-directory: glyph-server/crates/glyph-server-worker
        run: |
          cargo install worker-build --locked
          worker-build --release
      - name: Verify package and build release tarball
        working-directory: glyph-server/npm
        run: |
          test "$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME#v}"
          npm test
          npm pack
          sha256sum glyph-server-*.tgz > npm.sha256
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: glyph-server/npm/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: checksums-npm
          path: glyph-server/npm/npm.sha256
          if-no-files-found: error

  publish:
    needs: [build, npm-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          merge-multiple: true
          path: checksums
      - name: Combine checksums
        run: cat checksums/*.sha256 | sort > SHA256SUMS.txt
      # `glyph update` and the npm installer accept only signed checksums.
      - name: Sign checksums
        env:
          GLYPH_RELEASE_KEY: ${{ secrets.GLYPH_RELEASE_KEY }}
        run: sh scripts/sign-release.sh SHA256SUMS.txt "${{ github.repository }}" "${{ github.ref_name }}"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt SHA256SUMS.txt.minisig --clobber
          gh release edit "${{ github.ref_name }}" --draft=false --latest
