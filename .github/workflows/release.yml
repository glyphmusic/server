name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: glyph-server
      - uses: actions/checkout@v4
        with:
          repository: glyphmusic/desktop
          ref: v0.2.0
          path: glyph
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: glyph-server
        run: cargo build --release -p glyph-server-native --target ${{ matrix.target }}
      - name: Package
        working-directory: glyph-server
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="glyph-server-${VERSION}-${{ matrix.target }}"
          mkdir -p dist/stage
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/glyph-server.exe" dist/stage/
            cp LICENSE-MIT LICENSE-APACHE README.md dist/stage/
            (cd dist/stage && 7z a -tzip "../${NAME}.zip" . >/dev/null)
            ARCHIVE="dist/${NAME}.zip"
          else
            cp "target/${{ matrix.target }}/release/glyph-server" dist/stage/
            cp LICENSE-MIT LICENSE-APACHE README.md dist/stage/
            tar -C dist/stage -czf "dist/${NAME}.tar.gz" .
            ARCHIVE="dist/${NAME}.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "$(basename "$ARCHIVE")" > "$(basename "$ARCHIVE").sha256")
          else
            (cd dist && shasum -a 256 "$(basename "$ARCHIVE")" > "$(basename "$ARCHIVE").sha256")
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: glyph-server/RELEASE_NOTES.md
          files: |
            glyph-server/${{ env.ARCHIVE }}
      - uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.target }}
          path: glyph-server/dist/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          merge-multiple: true
          path: checksums
      - name: Combine checksums
        run: cat checksums/*.sha256 | sort > SHA256SUMS.txt
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber
          gh release edit "${{ github.ref_name }}" --draft=false --latest
