# Keeps the release build cache warm. GitHub only lets a tag run restore
# caches from its own tag or from main, so release.yml (save-if: false)
# restores what this workflow saves on main. rust-cache stores the compiled
# dependencies, which take most of the build time, plus worker-build.
# Matrix, packages, toolchain and env must match release.yml, or the keys differ.
name: Release cache

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - .github/workflows/release-cache.yml
  # Fridays: picks up a new stable Rust (released on Thursdays) and keeps the
  # caches alive, since GitHub drops caches unused for 7 days.
  schedule:
    - cron: "0 4 * * 5"
  workflow_dispatch:

concurrency:
  group: release-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          path: glyph-server
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: glyph-server
          shared-key: release-${{ matrix.target }}
      # Same command as release.yml so the dependencies get identical features.
      - name: Build
        working-directory: glyph-server
        run: cargo build --release -p glyph-server-native --target ${{ matrix.target }}

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: glyph-server
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: glyph-server
          shared-key: release-worker
      - name: Build the portable Worker payload
        working-directory: glyph-server/crates/glyph-server-worker
        run: |
          # Same version as release.yml.
          cargo install worker-build --version 0.8.7 --locked
          worker-build --release
