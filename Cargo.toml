[workspace]
resolver = "2"
members = [
    "crates/glyph-server-core",
    "crates/glyph-server-worker",
    "crates/glyph-server-native",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/glyphmusic/glyph-server"
rust-version = "1.85"

[workspace.dependencies]
# Shared wire types. For releases pin the tag of the main repo instead:
#   glyph-protocol = { git = "https://github.com/glyphmusic/glyph", tag = "protocol-v1" }
glyph-protocol = { path = "../glyph/crates/glyph-protocol" }
glyph-server-core = { path = "crates/glyph-server-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
async-trait = "0.1"
url = "2"
base64 = "0.22"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
