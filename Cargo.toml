[workspace]
resolver = "2"
members = [
    "crates/glyph-server-core",
    "crates/glyph-server-worker",
    "crates/glyph-server-native",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/glyphmusic/server"
rust-version = "1.85"

[workspace.dependencies]
# Shared wire types. For releases pin the tag of the main repo instead:
#   glyph-protocol = { git = "https://github.com/glyphmusic/desktop", tag = "protocol-v1" }
glyph-protocol = { path = "../glyph/crates/glyph-protocol" }
glyph-server-core = { path = "crates/glyph-server-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
async-trait = "0.1"
url = "2"
base64 = "0.22"
sha2 = "0.10"

# RSA key generation in the passkey tests is very slow unoptimized.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# Symbols must stay: wasm-bindgen (Worker build) needs the externref table exports.
strip = "debuginfo"
